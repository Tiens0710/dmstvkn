buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * Workaround for libraries that still call jcenter().
 * This adds a jcenter() method to repository handlers that simply uses mavenCentral().
 */
def addJCenterShim(handler) {
    handler.ext.jcenter = {
        handler.mavenCentral()
    }
}

allprojects {
    addJCenterShim(repositories)
    buildscript {
        addJCenterShim(repositories)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
